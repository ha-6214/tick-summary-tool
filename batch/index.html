<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歩み値 一括集計</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1a1f2b; --muted:#667085; --border:#e3e6eb;
    --accent:#3b5bdb; --accent-h:#2f4bc0; --ok:#2f9e6f; --warn:#c0492f; --amber:#8a6d1f;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
       line-height:1.6;-webkit-text-size-adjust:100%;padding:20px 14px 60px}
  .wrap{max-width:820px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:1.2rem;margin:0;font-weight:600}
  .ver{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
  .step{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:6px;
        display:flex;justify-content:space-between;align-items:center;gap:10px}
  .clr{font:inherit;font-size:.76rem;font-weight:600;padding:4px 10px;border-radius:7px;
       background:#fff;border:1px solid var(--border);color:var(--muted);cursor:pointer}
  .clr:hover{color:var(--ink)}
  .filebox{border:1.5px dashed var(--border);border-radius:10px;padding:12px;background:#fafbfc;margin-bottom:14px}
  .filebox:last-child{margin-bottom:0}
  input[type=file]{font:inherit;font-size:.8rem;max-width:100%;display:block;width:100%}
  .fname{font-family:var(--mono);font-size:.78rem;color:var(--accent);word-break:break-all;display:block;margin-top:6px}
  code{font-family:var(--mono);font-size:.78rem;background:#eef1f6;padding:1px 6px;border-radius:5px}
  .note{font-size:.78rem;color:var(--muted);margin-top:6px}
  button{font:inherit;font-weight:600;cursor:pointer;border-radius:9px;border:1px solid transparent;
         padding:11px 20px;transition:background .15s,opacity .15s}
  .run{background:var(--accent);color:#fff;font-size:.98rem}
  .run:hover:not(:disabled){background:var(--accent-h)}
  .run:disabled{opacity:.45;cursor:default}
  .ghost{background:#fff;border-color:var(--border);color:var(--ink);padding:9px 15px;font-size:.85rem}
  .actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .status{font-size:.84rem;color:var(--muted)}
  .status.ok{color:var(--ok)} .status.err{color:var(--warn);white-space:pre-wrap}
  .readback{background:#f7f9fc;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:.8rem;
            white-space:pre-wrap;font-family:var(--mono)}
  .rb-warn{color:var(--amber)}
  .bar{height:8px;background:#e9ecf2;border-radius:6px;overflow:hidden;margin:10px 0 6px}
  .bar > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  table{width:100%;border-collapse:collapse;font-size:.78rem;margin-top:8px}
  th,td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;white-space:nowrap}
  th{color:var(--muted);font-weight:600}
  td.num{text-align:right;font-family:var(--mono)}
  tr.err td{color:var(--warn)}
  .scroll{overflow:auto;max-height:46vh}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>歩み値 一括集計</h1>
    <span class="ver" id="ver">読み込み中</span>
  </div>

  <div class="card">
    <div class="step"><span>① 銘柄マスタ（master-stocks.md）</span><button class="clr" id="cMaster">クリア</button></div>
    <div class="filebox">
      <input type="file" id="fMaster">
      <span class="fname" id="nMaster">未選択</span>
    </div>

    <div class="step"><span>② 前日データ（省略可・JSONまたはMD／複数選択できます）</span><button class="clr" id="cPrev">クリア</button></div>
    <div class="filebox">
      <input type="file" id="fPrev" multiple>
      <span class="fname" id="nPrev">未選択</span>
    </div>

    <div class="step"><span>③ 当日の歩み値CSV（まとめて選びます）</span><button class="clr" id="cCsv">クリア</button></div>
    <div class="filebox">
      <input type="file" id="fCsv" multiple>
      <span class="fname" id="nCsv">未選択</span>
    </div>
    <div class="note">ファイル名は <code>qr-銘柄コード-日付.csv</code> の形を読み取ります。</div>

    <div class="actions" style="margin-top:14px">
      <button class="ghost" id="btnClearAll">すべてクリア</button>
      <button class="ghost" id="btnCheck" disabled>事前確認</button>
      <button class="run" id="btnRun" disabled>一括集計</button>
      <span class="status" id="msg"></span>
    </div>
    <div class="readback hidden" id="readback"></div>
  </div>

  <div class="card hidden" id="progCard">
    <div class="step">進み具合</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="status" id="prog"></div>
    <div class="scroll"><table id="tbl">
      <thead><tr><th>コード</th><th>銘柄</th><th class="num">買い</th><th class="num">売り</th><th>押し目</th><th>状態</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </div>

  <div class="card hidden" id="outCard">
    <div class="step">書き出し</div>
    <div class="status ok" id="outMsg"></div>
    <div class="actions" style="margin-top:10px">
      <button class="ghost" id="dlCsv">転記用CSV</button>
      <button class="ghost" id="dlJson">前日データJSON</button>
      <button class="ghost" id="dlZip">銘柄ごとMD（ZIP）</button>
    </div>
    <div class="note">保存できないときは、同じボタンをもう一度押すと共有の画面が開きます。</div>
  </div>
</div>

<script src="../pyodide/pyodide.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let py = null, out = null, running = false;
const files = { master: null, prev: [], csv: [] };
const doneNames = new Set();

function setMsg(t, cls){ const m=$('msg'); m.textContent=t; m.className='status'+(cls?' '+cls:''); }
function showRB(lines){ const r=$('readback'); r.classList.remove('hidden'); r.textContent=lines.join('\n'); }

async function boot(){
  setMsg('集計の部品を読み込んでいます…');
  py = await loadPyodide({ indexURL: '../pyodide/' });
  const bust = '?t=' + Date.now();
  const engine = await (await fetch('../tick_value_summary.py' + bust, { cache: 'no-store' })).text();
  const runner = await (await fetch('./batch_runner.py' + bust, { cache: 'no-store' })).text();
  py.FS.writeFile('/home/pyodide/batch_runner.py', runner);
  py.runPython('import sys; sys.path.insert(0, "/home/pyodide")');
  py.globals.set('ENGINE_SRC', engine);
  const info = py.runPython(`
import json, batch_runner as B
json.dumps(B.load_engine(ENGINE_SRC))`);
  const v = JSON.parse(info);
  $('ver').textContent = 'ルール版 ' + v.rule_version + ' ／ 係 ' + (v.runner_version || '不明');
  setMsg('ファイルを選んでください');
  $('btnCheck').disabled = false;
}

function pick(input, label, key, multi){
  input.addEventListener('change', () => {
    const fs = Array.from(input.files || []);
    if (multi) { files[key] = fs; label.textContent = fs.length ? fs.length + '件' : '未選択'; }
    else { files[key] = fs[0] || null; label.textContent = fs[0] ? fs[0].name : '未選択'; }
    resetRun();
  });
}
pick($('fMaster'), $('nMaster'), 'master', false);
pick($('fPrev'), $('nPrev'), 'prev', true);
pick($('fCsv'), $('nCsv'), 'csv', true);

function clearOne(key){
  const map = { master: ['fMaster', 'nMaster', false],
                prev: ['fPrev', 'nPrev', true],
                csv: ['fCsv', 'nCsv', true] };
  const [inputId, labelId, multi] = map[key];
  $(inputId).value = '';
  files[key] = multi ? [] : null;
  $(labelId).textContent = '未選択';
  resetRun();
}
function resetRun(){
  doneNames.clear();
  out = null;
  $('btnRun').disabled = true;
  $('outCard').classList.add('hidden');
  $('progCard').classList.add('hidden');
  $('tbl').querySelector('tbody').innerHTML = '';
  $('bar').style.width = '0';
  $('prog').textContent = '';
  $('readback').classList.add('hidden');
  if (py) { try { py.runPython('B.reset_results()'); } catch (e) { /* 読み込み前は何もしない */ } }
  setMsg('ファイルを選んでください');
}
$('cMaster').addEventListener('click', () => clearOne('master'));
$('cPrev').addEventListener('click', () => clearOne('prev'));
$('cCsv').addEventListener('click', () => clearOne('csv'));
$('btnClearAll').addEventListener('click', () => {
  if (running) { setMsg('集計の途中です。終わってからクリアしてください。', 'err'); return; }
  clearOne('master'); clearOne('prev'); clearOne('csv');
});

async function loadInputs(){
  if (!files.master) throw new Error('銘柄マスタを選んでください');
  if (!files.csv.length) throw new Error('歩み値CSVを選んでください');
  py.globals.set('MASTER_MD', await files.master.text());
  const m = JSON.parse(py.runPython('json.dumps(B.load_master(MASTER_MD))'));

  const prev = [];
  for (const f of files.prev) prev.push({ name: f.name, text: await f.text() });
  py.globals.set('PREV_JSON', JSON.stringify(prev));
  const p = JSON.parse(py.runPython('json.dumps(B.load_prev(json.loads(PREV_JSON)))'));

  py.globals.set('CSV_NAMES', JSON.stringify(files.csv.map(f => f.name)));
  const c = JSON.parse(py.runPython('json.dumps(B.check(json.loads(CSV_NAMES)))'));
  return { m, p, c };
}

$('btnCheck').addEventListener('click', async () => {
  try {
    setMsg('確認しています…');
    const { m, p, c } = await loadInputs();
    const L = [];
    L.push('銘柄マスタ: ' + m.count + '件（版 ' + (m.master_version || '不明') + '）');
    L.push('歩み値CSV: ' + c.files + '件 ／ 銘柄 ' + c.codes + '件');
    L.push('対象日: ' + (c.today || '読み取れません'));
    L.push('前日データ: ' + p.count + '件（今回の対象で ' + c.prev_found + '件）');
    const warn = [];
    if (c.duplicated.length) warn.push('銘柄コードの重複: ' + c.duplicated.join('、'));
    if (c.not_in_master.length) warn.push('マスタに未登録: ' + c.not_in_master.join('、'));
    if (c.name_unreadable.length) warn.push('ファイル名を読めません: ' + c.name_unreadable.join('、'));
    if (Object.keys(c.dates).length > 1) warn.push('日付が混ざっています: ' + Object.keys(c.dates).join('、'));
    if (c.prev_missing.length) warn.push('前日データなし（当日分だけで集計）: ' + c.prev_missing.length + '件');
    if (c.rule_mismatch.length) warn.push('集計ルールの版が違う前日データ: ' + c.rule_mismatch.join('、'));
    if (p.conflicts.length) warn.push('前日のJSONとMDで値が違う銘柄: ' + p.conflicts.join('、'));
    if (p.unreadable.length) warn.push('読めなかった前日ファイル: ' + p.unreadable.join(' / '));
    if (warn.length) L.push('', '注意:'); warn.forEach(w => L.push('  ・' + w));
    showRB(L);
    if (c.duplicated.length) { setMsg('銘柄コードが重複しています。集計できません。', 'err'); return; }
    $('btnRun').disabled = false;
    setMsg('確認しました。集計できます。', 'ok');
  } catch (e) { setMsg(String(e.message || e), 'err'); }
});

$('btnRun').addEventListener('click', async () => {
  if (running) return;
  running = true; $('btnRun').disabled = true; $('btnCheck').disabled = true;
  $('progCard').classList.remove('hidden');
  const tb = $('tbl').querySelector('tbody');
  if (!doneNames.size) { tb.innerHTML = ''; py.runPython('B.reset_results()'); }
  const total = files.csv.length;
  let n = doneNames.size, err = 0;
  try {
    for (const f of files.csv) {
      if (doneNames.has(f.name)) continue;
      $('prog').textContent = (n + 1) + ' / ' + total + '　' + f.name;
      py.globals.set('CSV_NAME', f.name);
      py.globals.set('CSV_TEXT', await f.text());
      const r = JSON.parse(py.runPython('json.dumps(B.run_one(CSV_NAME, CSV_TEXT))'));
      const tr = document.createElement('tr');
      if (r.status !== '完了') { tr.className = 'err'; err++; }
      tr.innerHTML = '<td>' + r.code + '</td><td>' + (r.name || '') + '</td>'
        + '<td class="num">' + (r.buy_score ?? '') + '</td>'
        + '<td class="num">' + (r.sell_score ?? '') + '</td>'
        + '<td>' + ((r.dip_buy || '').indexOf('構図あり') >= 0 ? '○' : '') + '</td>'
        + '<td>' + (r.status === '完了' ? '完了' : (r.error || 'エラー')) + '</td>';
      tb.appendChild(tr);
      doneNames.add(f.name);
      n++;
      $('bar').style.width = (n / total * 100) + '%';
      await new Promise(res => setTimeout(res, 0));
    }
    out = JSON.parse(py.runPython('json.dumps(B.finalize())'));
    $('outCard').classList.remove('hidden');
    $('outMsg').textContent = '対象 ' + out.summary.target + '件 ／ 完了 ' + out.summary.done
      + '件 ／ エラー ' + out.summary.error + '件　押し目候補 '
      + out.summary.dip_buy_candidates.length + '件';
    $('prog').textContent = '集計が終わりました。';
    setMsg('集計が終わりました。', 'ok');
  } catch (e) {
    setMsg('途中で止まりました: ' + String(e.message || e) + '（もう一度「一括集計」を押すと続きから進みます）', 'err');
    $('btnRun').disabled = false;
  } finally {
    running = false; $('btnCheck').disabled = false;
  }
});

function b64ToBytes(b64){
  const bin = atob(b64); const a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a;
}
async function give(name, data, type, bom){
  const blob = (typeof data === 'string')
    ? new Blob(bom ? [new Uint8Array([0xEF,0xBB,0xBF]), data] : [data], { type })
    : new Blob([data], { type });
  const file = new File([blob], name, { type });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { /* 保存に切り替える */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
$('dlCsv').addEventListener('click', () => out && give(out.csv_name, out.csv, 'text/csv', true));
$('dlJson').addEventListener('click', () => out && give(out.json_name, out.json, 'application/json'));
$('dlZip').addEventListener('click', () => out && give(out.zip_name, b64ToBytes(out.zip_b64), 'application/zip'));

boot().catch(e => setMsg('読み込みに失敗しました: ' + e, 'err'));
</script>
</body>
</html>
